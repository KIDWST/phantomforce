<title>Vespergate 3.0: Living Dread</title>
<style>

<body>
<div class="vg-app">
  <canvas id="vg" width="640" height="360" aria-label="Vespergate game"></canvas>
</div>
<div class="vg-status" data-vg-status>Vespergate · HD</div>
<div class="vg-toolbar" role="toolbar" aria-label="Game controls">
  <button class="vg-tool" type="button" data-vg-sound aria-label="Mute sound" title="Mute sound">SOUND</button>
  <button class="vg-tool" type="button" data-vg-pause aria-label="Pause game" title="Pause game">PAUSE</button>
  <button class="vg-tool" type="button" data-vg-fullscreen aria-label="Enter fullscreen" title="Enter fullscreen">FULLSCREEN</button>
</div>
<div data-vg-hint hidden></div>
<div data-vg-overlay data-kind="title"></div>
<div class="vg-touch" data-vg-touch aria-label="Touch game controls">
  <div class="vg-stick" data-vg-stick aria-label="Movement joystick"></div>
  <div class="vg-portrait-sigil" aria-hidden="true">◇</div>
  <div class="vg-actions">
    <button class="vg-action" type="button" data-vg-action="strike">STRIKE</button>
    <button class="vg-action" type="button" data-vg-action="beam">BEAM</button>
    <button class="vg-action" type="button" data-vg-action="gate">GATE</button>
    <button class="vg-action" type="button" data-vg-action="roll">ROLL</button>
    <button class="vg-action" type="button" data-vg-action="use">USE</button>
    <button class="vg-action" type="button" data-vg-action="map">MAP</button>
  </div>
</div>
