<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Cipher Keep cover art</title>
  <desc id="desc">A glowing quill faces a mysterious stone keep filled with floating cipher letters.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#07131b"/>
      <stop offset=".55" stop-color="#102b32"/>
      <stop offset="1" stop-color="#25152c"/>
    </linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#sky)"/>
  <circle cx="930" cy="130" r="88" fill="#ffb454" opacity=".13"/>
  <path d="M610 560V238l92-54 75 42 67-98 70 98 76-42 92 54v322z" fill="#111b24" stroke="#6ee7d8" stroke-opacity=".35" stroke-width="5"/>
  <path d="M782 560V360q0-72 62-72t62 72v200z" fill="url(#door)" opacity=".75" filter="url(#glow)"/>
  <g fill="#d8fff8" font-family="Georgia,serif" font-weight="700" opacity=".7">
    <text x="660" y="290" font-size="42">A</text><text x="970" y="310" font-size="35">Q</text>
    <text x="720" y="410" font-size="31">R</text><text x="1010" y="430" font-size="44">K</text>
    <text x="645" y="500" font-size="28">E</text><text x="944" y="500" font-size="32">V</text>
  </g>
  <path d="M170 505c112-36 190-119 267-276-9 125-52 228-142 309z" fill="#f4e6c0" stroke="#ffb454" stroke-width="7" filter="url(#glow)"/>
  <path d="M200 523l208-249" stroke="#233642" stroke-width="10"/>
  <text x="72" y="118" fill="#eefcf8" font-family="Georgia,serif" font-size="78" font-weight="700">CIPHER KEEP</text>
  <text x="78" y="164" fill="#79e6d6" font-family="system-ui,sans-serif" font-size="25" letter-spacing="7">TYPE • EXPLORE • DEDUCE</text>
</svg>
