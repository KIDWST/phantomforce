<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Phantom Rumble 3.0 Overdrive cover art</title>
  <desc id="desc">Two round masked chicken ninjas collide in a blazing coop arena while one ricochets into a cracked energy fence under the words Phantom Rumble Overdrive.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07110c"/><stop offset=".48" stop-color="#160b22"/><stop offset="1" stop-color="#3b130c"/></linearGradient>
    <radialGradient id="blast" cx="58%" cy="58%" r="42%"><stop offset="0" stop-color="#fff8c5" stop-opacity=".95"/><stop offset=".18" stop-color="#ffb347" stop-opacity=".72"/><stop offset=".52" stop-color="#ff3d5a" stop-opacity=".18"/><stop offset="1" stop-color="#ff3d5a" stop-opacity="0"/></radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#18ff96"/><stop offset=".5" stop-color="#fff3bf"/><stop offset="1" stop-color="#ff5a36"/></linearGradient>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="11" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="28"/></filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0H0V64" fill="none" stroke="#8bffc4" stroke-opacity=".06"/></pattern>
  </defs>
