[package]
name = "phantomplay"
version = "0.3.5"
edition = "2024"
autobins = false
build = "build.rs"

[package.metadata.winres]
CompanyName = "PhantomForce"
FileDescription = "PhantomPlay native game library and creation studio"
LegalCopyright = "Copyright © PhantomForce"
OriginalFilename = "PhantomPlay.exe"
ProductName = "PhantomPlay"

[[bin]]
name = "PhantomPlay"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
dioxus = { version = "0.7.9", features = ["desktop"] }
dioxus-html = "0.7.9"
notify = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
dioxus-icons = "0.1.0"
rfd = "0.17"
sha2 = "0.10"
zip = { version = "4.6", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[dev-dependencies]
tempfile = "3"
